name: Build and Publish cegarza.com

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment even without code changes"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".version"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: sendouq/cegarza-blog

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cegarza.com
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: v${{ steps.nextver.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.nextver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch deployment credentials
        id: broker
        uses: cesaregarza/.github/actions/fetch-broker-credentials@a1d2fb4a6b288066574b1ac53074ac62e920a07f
        with:
          broker-url: https://credentials.garz.ai
          audience: https://credentials.garz.ai/v1
          capability: digitalocean-registry-write

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ fromJson(steps.broker.outputs.secrets-json).DIGITALOCEAN_REGISTRY_TOKEN }}
          password: ${{ fromJson(steps.broker.outputs.secrets-json).DIGITALOCEAN_REGISTRY_TOKEN }}

      - name: Read .version
        id: semver
        run: echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Get latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: nextver
        uses: actions/github-script@v7
        env:
          BASE_VERSION: ${{ steps.semver.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        with:
          script: |
            function parse(v) {
              const cleaned = String(v || '')
                .trim()
                .replace(/^v\.?/, '');
              const parts = cleaned.split('.');
              const [M = '0', m = '0', p = '0'] = parts;
              return {
                M: Number(M) || 0,
                m: Number(m) || 0,
                p: Number(p) || 0,
              };
            }
            const base = parse(process.env.BASE_VERSION);
            const latest = parse(process.env.LATEST_TAG);
            const baseGreater =
              base.M > latest.M ||
              (base.M === latest.M && (
                base.m > latest.m ||
                (base.m === latest.m && base.p > latest.p)
              ));
            const next = baseGreater
              ? `${base.M}.${base.m}.${base.p}`
              : `${latest.M}.${latest.m}.${latest.p + 1}`;
            core.setOutput('version', next);

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.nextver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.nextver.outputs.version }}
            GIT_SHA=${{ github.sha }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Check if release already exists
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "Release v${VERSION} already exists, skipping"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi

  update-config:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cegarza.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Fetch deployment credentials
        id: broker
        uses: cesaregarza/.github/actions/fetch-broker-credentials@a1d2fb4a6b288066574b1ac53074ac62e920a07f
        with:
          broker-url: https://credentials.garz.ai
          audience: https://credentials.garz.ai/v1
          capability: config-repo-write

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: cesaregarza/GarzAICluster
          token: ${{ fromJson(steps.broker.outputs.secrets-json).GARZAI_CLUSTER_GITHUB_TOKEN }}
          path: config-repo
          ref: main

      - name: Install dependencies
        run: python3 -m pip install --user "ruamel.yaml>=0.18.6,<0.19"

      - name: Update Helm values
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          python3 source-repo/ops/update_cegarza_deployment.py \
            config-repo/helm/cegarza-blog/values-cegarza.yaml \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST"

          test "$(git -C config-repo diff --name-only | wc -l)" -eq 1
          test "$(git -C config-repo diff --name-only)" = \
            "helm/cegarza-blog/values-cegarza.yaml"
          git -C config-repo diff --check

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ fromJson(steps.broker.outputs.secrets-json).GARZAI_CLUSTER_GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          cd config-repo

          BRANCH="bot/cegarza-blog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "cegarza-bot"
          git config user.email "sre+bot@cegarza.com"
          git checkout -b "$BRANCH"
          git add helm/cegarza-blog/values-cegarza.yaml
          git commit -m "chore(cegarza-blog): deploy ${IMAGE_TAG}"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[bot] Deploy cegarza-blog ${IMAGE_TAG}" \
            --body "Automated immutable release activation from cegarza.com.

          **Source commit:** ${{ github.repository }}@${{ github.sha }}
          **Image tag:** ${IMAGE_TAG}
          **Image digest:** ${{ needs.build.outputs.image_digest }}

          This PR updates only the dedicated cegarza-blog values overlay.
          The one-time Deployment replacement is enabled only when the old
          immutable selector is still present."
